# Render Blueprint for the Django API.
# Render -> New -> Blueprint -> pick this repo. Values marked `sync: false`
# are asked for in the dashboard during setup and never live in the repo.
services:
  - type: web
    name: stockache-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: >-
      gunicorn stockache.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: ENABLE_DEV_LOGIN
        value: "False"
      - key: PAYMENT_MODE
        value: sandbox
      - key: PLATFORM_COMMISSION_RATE
        value: "0.02"
      - key: SUPABASE_URL
        value: https://uiblezlkmydzndoamvsk.supabase.co
      - key: SUPABASE_STORAGE_BUCKET
        value: stocklot-images
      # Asked for during setup:
      - key: DATABASE_URL          # Supabase SESSION pooler, port 5432
        sync: false
      - key: SUPABASE_ANON_KEY     # publishable key
        sync: false
      - key: SUPABASE_SERVICE_KEY  # secret key -- server only
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # your Netlify URL, e.g. https://stockache.netlify.app
        sync: false
